[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo_mysql', 'php82Extensions.pdo', 'php82Extensions.intl', 'php82Extensions.ctype', 'php82Extensions.iconv', 'php82Packages.composer']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader']

[phases.build]
cmds = ['php bin/console cache:clear']

[start]
cmd = 'php -S 0.0.0.0:$PORT -t public'
